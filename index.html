<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0d1117"/>
<title>Terminale — impara Linux</title>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" href="./icon.svg"/>
<link rel="apple-touch-icon" href="./icon.svg"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Terminale"/>
<style>:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2330; --line:#2a3140;
  --fg:#d7dde6; --dim:#8a94a3; --faint:#6b7483;
  --acc:#39d353; --acc2:#2ea043; --amber:#e3a008; --blue:#58a6ff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{font-size:16px;line-height:1.55}
#app{min-height:100vh}

.app{max-width:760px;margin:0 auto;padding-bottom:78px}
.main{padding:18px 16px 24px}

/* Nav bar bassa */
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);
  border-top:1px solid var(--line);z-index:50}
.nav-btn{flex:1;background:none;border:none;color:var(--faint);padding:9px 4px 10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:var(--sans)}
.nav-btn .nav-ico{font-size:19px;font-family:var(--mono)}
.nav-btn .nav-lab{font-size:11px;letter-spacing:.02em}
.nav-btn.att{color:var(--acc)}

/* Titoli */
h1{font-size:25px;line-height:1.2;margin:6px 0 14px;font-weight:700}
h2{font-size:22px;margin:0 0 12px;font-weight:700}
h3{font-size:16px;font-weight:600}
h4.sub{font-size:14px;color:var(--acc);margin:16px 0 6px;font-family:var(--mono);
  text-transform:uppercase;letter-spacing:.04em}
.sub-desc{color:var(--dim);font-size:14px;margin-bottom:16px}

/* Oggi */
.hero{background:linear-gradient(160deg,var(--bg2),var(--bg3));border:1px solid var(--line);
  border-radius:14px;padding:18px 18px 16px;margin-bottom:20px}
.hero-prompt{font-family:var(--mono);color:var(--acc);font-size:13px;margin-bottom:8px}
.blink{animation:bl 1.1s step-end infinite}
@keyframes bl{50%{opacity:0}}
.hero-stat{display:flex;gap:10px;margin-top:14px}
.hero-stat>div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:9px 6px;text-align:center}
.hero-stat b{display:block;font-size:20px;color:var(--acc);font-family:var(--mono)}
.hero-stat span{font-size:11px;color:var(--dim)}

.oggi-lista h3{margin-bottom:10px}
.oggi-riga,.corso-card,.lez-riga,.oggi-riga{font-family:var(--sans)}
.oggi-riga{width:100%;display:flex;align-items:center;gap:12px;background:var(--bg2);
  border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:9px;
  cursor:pointer;text-align:left;color:var(--fg);transition:border-color .15s}
.oggi-riga:hover,.oggi-riga:active{border-color:var(--acc2)}
.oggi-ico{font-family:var(--mono);color:var(--acc);font-size:17px;width:28px;text-align:center}
.oggi-info{flex:1;min-width:0}
.oggi-nome{font-weight:600;font-size:15px}
.oggi-corso{font-size:12px;color:var(--faint)}
.oggi-freccia{color:var(--acc);font-size:18px}
.done-all{background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:26px;text-align:center;color:var(--dim);line-height:1.8}

/* Teoria - card corso */
.corso-card{width:100%;display:flex;gap:13px;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:11px;cursor:pointer;text-align:left;color:var(--fg)}
.corso-card:hover{border-color:var(--acc2)}
.corso-ico{font-family:var(--mono);color:var(--acc);font-size:22px;font-weight:700;
  width:40px;flex-shrink:0;text-align:center;padding-top:2px}
.corso-card-body{flex:1;min-width:0}
.corso-card-top{display:flex;justify-content:space-between;align-items:baseline}
.corso-card-top h3{font-size:17px}
.corso-perc{font-family:var(--mono);color:var(--acc);font-size:13px}
.corso-desc{color:var(--dim);font-size:13px;margin:4px 0 8px;line-height:1.45}

/* Barra progresso */
.barra{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.barra.sm{height:5px}
.barra.big{height:9px;margin:4px 0}
.barra.flex{flex:1}
.barra-in{height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.barra-txt{font-size:12px;color:var(--faint);margin:6px 0 16px;font-family:var(--mono)}
.barra-txt.center{text-align:center}

/* Corso - moduli e lezioni */
.corso-head{display:flex;gap:13px;margin-bottom:14px;align-items:flex-start}
.corso-head h2{margin-bottom:2px}
.modulo{margin-bottom:18px}
.modulo-tit{font-size:13px;color:var(--amber);font-family:var(--mono);text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.lez-riga{width:100%;display:flex;align-items:center;gap:10px;background:var(--bg2);
  border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:7px;
  cursor:pointer;text-align:left;color:var(--fg)}
.lez-riga:hover{border-color:var(--acc2)}
.spunta{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--bg)}
.spunta.on{background:var(--acc);border-color:var(--acc)}
.lez-nome{flex:1;font-size:14.5px}
.fascia-mini{font-size:10px;padding:2px 6px;border-radius:5px;font-family:var(--mono)}

/* Fasce colore */
.fascia{display:inline-block;font-size:11px;padding:2px 9px;border-radius:6px;font-family:var(--mono);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.fascia-essenziale{background:rgba(57,211,83,.16);color:var(--acc)}
.fascia-utile{background:rgba(88,166,255,.16);color:var(--blue)}
.fascia-buono{background:rgba(227,160,8,.16);color:var(--amber)}

/* Lezione - corpo */
.lez{padding-bottom:10px}
.back{background:none;border:none;color:var(--dim);font-size:14px;cursor:pointer;
  padding:4px 0;margin-bottom:10px;font-family:var(--sans)}
.back:hover{color:var(--acc)}
.corpo{margin-top:6px}
.par{margin:11px 0;font-size:15.5px;line-height:1.65}
.par code,.nota code,.tab code,.prova code{font-family:var(--mono);background:var(--bg3);
  padding:1px 5px;border-radius:4px;font-size:.88em;color:var(--blue)}
.par b{color:#fff;font-weight:600}
.par i{color:var(--dim)}

.cmd{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:8px;padding:10px 12px;margin:9px 0}
.cmd-x{display:block;font-family:var(--mono);color:var(--acc);font-size:14px;word-break:break-all}
.cmd-d{display:block;color:var(--dim);font-size:13px;margin-top:5px;line-height:1.45}

.out{background:#07090d;border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;
  font-family:var(--mono);font-size:13px;color:var(--fg);overflow-x:auto;line-height:1.5;white-space:pre}

.nota{background:var(--bg3);border-radius:8px;padding:11px 13px;margin:11px 0;font-size:14px;
  color:var(--dim);line-height:1.55;border-left:3px solid var(--amber)}
.nota code{color:var(--amber)}

.tab{width:100%;border-collapse:collapse;margin:11px 0;font-size:14px}
.tab td{border:1px solid var(--line);padding:8px 10px;vertical-align:top}
.tab td:first-child{width:38%;white-space:nowrap}
.tab td:first-child code{color:var(--acc);background:none;padding:0}

.prova{background:linear-gradient(135deg,rgba(57,211,83,.07),rgba(88,166,255,.05));
  border:1px solid var(--acc2);border-radius:9px;padding:13px;margin:14px 0}
.prova-tit{font-family:var(--mono);color:var(--acc);font-size:13px;font-weight:700;margin-bottom:6px}
.prova-x{font-size:14.5px;line-height:1.55}
.prova-t{font-size:13px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.prova-t b{color:var(--fg)}

.lez-azioni{display:flex;gap:10px;margin-top:20px}
.segna{flex:1;background:var(--bg2);border:1px solid var(--acc2);color:var(--acc);
  padding:12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.segna.segnata{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.avanti{background:var(--bg3);border:1px solid var(--line);color:var(--fg);padding:12px 16px;
  border-radius:9px;font-size:14px;cursor:pointer;font-family:var(--sans)}

/* Prontuario */
.cerca{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;color:var(--fg);font-size:15px;font-family:var(--mono);margin-bottom:8px}
.cerca:focus{outline:none;border-color:var(--acc)}
.pront-n{font-size:12px;color:var(--faint);margin-bottom:10px;font-family:var(--mono)}
.pront-riga{background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;margin-bottom:7px}
.pront-cmd{font-family:var(--mono);color:var(--acc);font-size:14px;display:block;word-break:break-all}
.pront-desc{font-size:13px;color:var(--dim);display:block;margin-top:3px}
.pront-corso{font-size:10.5px;color:var(--faint);font-family:var(--mono);text-transform:uppercase}

/* Tu */
.prog-corsi{margin:16px 0 8px}
.prog-riga{display:flex;align-items:center;gap:10px;padding:7px 0}
.prog-ico{font-family:var(--mono);color:var(--acc);width:30px;text-align:center}
.prog-nome{width:100px;font-size:14px}
.prog-perc{font-family:var(--mono);font-size:13px;color:var(--dim);width:40px;text-align:right}
.tu-h{margin:24px 0 4px;color:var(--fg)}
.backup-btns{display:flex;gap:10px;margin:12px 0}
.bk{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--fg);padding:12px;
  border-radius:9px;font-size:14px;cursor:pointer;text-align:center;font-family:var(--sans)}
.bk:hover{border-color:var(--acc2)}
.bk-imp{display:flex;align-items:center;justify-content:center}
.bk-msg{background:var(--bg3);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--acc);
  margin-bottom:8px;font-family:var(--mono)}
.arrivo{list-style:none;margin:8px 0}
.arrivo li{font-size:13.5px;color:var(--dim);padding:7px 0 7px 18px;position:relative;
  border-bottom:1px solid var(--line)}
.arrivo li:before{content:"◦";position:absolute;left:2px;color:var(--amber)}
</style>
</head>

ighe e poi premi <code>q</code>.",target:"Devi tornare al prompt normale dopo aver visto il manuale."}]}]},{id:"lx-nav",nome:"Muoversi tra le cartelle",lezioni:[{id:"lx-pwd",nome:"Dove sono: pwd, ls, cd",fascia:"essenziale",corpo:[{t:"p",x:"Il filesystem \xE8 un albero di cartelle. In ogni momento ti trovi \xABdentro\xBB una cartella, detta <b>cartella corrente</b>. Questi tre comandi sono il tuo GPS."},{t:"cmd",x:"pwd",d:"print working directory \u2014 stampa il percorso della cartella in cui sei adesso"},{t:"cmd",x:"ls",d:"list \u2014 elenca cosa c'\xE8 nella cartella corrente"},{t:"cmd",x:"cd Documenti",d:"change directory \u2014 entra nella cartella Documenti"},{t:"h",x:"Le scorciatoie di cd"},{t:"tab",rows:[["cd ..","sali di una cartella (alla \xABmadre\xBB)"],["cd ~","vai alla tua cartella home (la tua base)"],["cd /","vai alla radice, la cima dell'albero"],["cd -","torna alla cartella dov'eri prima"],["cd","da solo: torna alla home"]]},{t:"h",x:"Percorsi assoluti e relativi"},{t:"p",x:"Un percorso <b>assoluto</b> parte dalla radice e inizia con <code>/</code> (es. <code>/home/andrea/foto</code>): \xE8 valido sempre, da ovunque tu sia. Un percorso <b>relativo</b> parte da dove sei adesso (es. <code>foto/vacanze</code>): dipende dalla cartella corrente."},{t:"nota",x:"<code>.</code> significa \xABla cartella corrente\xBB, <code>..</code> significa \xABquella sopra\xBB. <code>~</code> \xE8 sempre la tua home."},{t:"prova",x:"Vai alla home, guarda cosa c'\xE8, entra in una cartella qualsiasi e controlla dove sei finito.",target:"pwd deve mostrare un percorso che finisce con il nome della cartella in cui sei entrato."}]},{id:"lx-ls",nome:"Guardare meglio con ls",fascia:"essenziale",corpo:[{t:"p",x:"<code>ls</code> da solo elenca i nomi. Con le opzioni diventa molto pi\xF9 informativo."},{t:"tab",rows:[["ls -l","formato lungo: permessi, proprietario, dimensione, data"],["ls -a","mostra anche i file nascosti (quelli che iniziano con .)"],["ls -h","dimensioni leggibili (KB, MB invece di byte) \u2014 usala con -l"],["ls -la","le pi\xF9 usate insieme: lungo + nascosti"],["ls -lh","lungo + dimensioni leggibili"],["ls -t","ordina per data, dal pi\xF9 recente"],["ls -R","entra anche nelle sottocartelle (ricorsivo)"]]},{t:"nota",x:"I file nascosti non sono \xABsegreti\xBB: sono solo file di configurazione che normalmente non vuoi vedere. Iniziano con un punto, es. <code>.bashrc</code>."}]}]},{id:"lx-file",nome:"File e cartelle",lezioni:[{id:"lx-crea",nome:"Creare: mkdir, touch",fascia:"essenziale",corpo:[{t:"cmd",x:"mkdir progetti",d:"make directory \u2014 crea la cartella \xABprogetti\xBB"},{t:"cmd",x:"mkdir -p a/b/c",d:"-p crea tutta la catena di cartelle annidate in un colpo"},{t:"cmd",x:"touch note.txt",d:"crea un file vuoto (o aggiorna la data se esiste gi\xE0)"},{t:"prova",x:"Crea una cartella <code>prova</code>, entraci, e crea dentro un file vuoto <code>ciao.txt</code>.",target:"ls dentro la cartella deve mostrare ciao.txt."}]},{id:"lx-copia",nome:"Copiare e spostare: cp, mv",fascia:"essenziale",corpo:[{t:"cmd",x:"cp file.txt copia.txt",d:"copy \u2014 copia il file (l'originale resta)"},{t:"cmd",x:"cp -r cartella/ backup/",d:"-r (ricorsivo) serve per copiare una cartella con tutto il contenuto"},{t:"cmd",x:"mv file.txt Documenti/",d:"move \u2014 sposta il file dentro Documenti"},{t:"cmd",x:"mv vecchio.txt nuovo.txt",d:"mv serve anche per RINOMINARE: stesso posto, nome diverso"},{t:"nota",x:"Attenzione: <code>cp</code> e <code>mv</code> sovrascrivono senza chiedere se la destinazione esiste gi\xE0. Aggiungi <code>-i</code> per farti chiedere conferma."}]},{id:"lx-rm",nome:"Cancellare: rm, rmdir",fascia:"essenziale",corpo:[{t:"cmd",x:"rm file.txt",d:"remove \u2014 cancella il file"},{t:"cmd",x:"rm -r cartella/",d:"cancella una cartella e TUTTO il suo contenuto"},{t:"cmd",x:"rmdir vuota/",d:"cancella una cartella solo se \xE8 vuota (pi\xF9 sicuro)"},{t:"nota",x:"\u26A0\uFE0F Nel terminale <b>non c'\xE8 il cestino</b>. <code>rm</code> cancella per sempre, subito. Non esiste \xABannulla\xBB. Il comando pi\xF9 temuto \xE8 <code>rm -rf /</code> (cancella tutto dalla radice): non eseguirlo MAI. La <code>-f</code> significa \xABforce\xBB, non chiedere conferma."}]},{id:"lx-leggi",nome:"Leggere i file: cat, less, head, tail",fascia:"essenziale",corpo:[{t:"cmd",x:"cat note.txt",d:"stampa tutto il contenuto del file a schermo"},{t:"cmd",x:"less grande.txt",d:"apre il file sfogliabile (frecce per scorrere, q per uscire). Meglio per file lunghi"},{t:"cmd",x:"head file.txt",d:"mostra solo le prime 10 righe"},{t:"cmd",x:"tail file.txt",d:"mostra solo le ultime 10 righe"},{t:"cmd",x:"tail -f log.txt",d:"-f \xABsegue\xBB il file in tempo reale: utile per guardare un log che cresce"},{t:"nota",x:"<code>head -n 3</code> o <code>tail -n 20</code> per scegliere quante righe."}]}]},{id:"lx-perm",nome:"Permessi",lezioni:[{id:"lx-perm-cap",nome:"Capire i permessi",fascia:"essenziale",corpo:[{t:"p",x:"Su Linux ogni file dice <b>chi</b> pu\xF2 farci <b>cosa</b>. Quando fai <code>ls -l</code>, la prima colonna \xE8 una stringa tipo <code>-rwxr-xr--</code>. Sembra arabo, ma si legge a blocchi."},{t:"h",x:"Come si legge -rwxr-xr--"},{t:"p",x:"Il primo carattere dice il tipo: <code>-</code> file normale, <code>d</code> cartella (directory). Poi tre gruppi da tre:"},{t:"tab",rows:[["rwx","PROPRIETARIO: pu\xF2 leggere (r), scrivere (w), eseguire (x)"],["r-x","GRUPPO: pu\xF2 leggere ed eseguire, non scrivere"],["r--","TUTTI GLI ALTRI: possono solo leggere"]]},{t:"p",x:"<b>r</b> = read (leggere), <b>w</b> = write (modificare/cancellare), <b>x</b> = execute (eseguire, se \xE8 un programma; entrare, se \xE8 una cartella). Il trattino <code>-</code> significa \xABquesto permesso manca\xBB."}]},{id:"lx-chmod",nome:"Cambiare i permessi: chmod",fascia:"essenziale",corpo:[{t:"p",x:"<code>chmod</code> (change mode) cambia i permessi. Due modi: a parole o a numeri."},{t:"h",x:"A parole (pi\xF9 intuitivo)"},{t:"cmd",x:"chmod +x script.sh",d:"aggiunge il permesso di esecuzione (serve per lanciare uno script)"},{t:"cmd",x:"chmod -w file.txt",d:"toglie il permesso di scrittura (lo rende di sola lettura)"},{t:"h",x:"A numeri (pi\xF9 compatto)"},{t:"p",x:"Ogni permesso vale un numero: r=4, w=2, x=1. Li sommi per ogni gruppo. Esempio: rwx = 4+2+1 = 7, r-x = 4+1 = 5, r-- = 4."},{t:"cmd",x:"chmod 755 script.sh",d:"proprietario rwx(7), gruppo r-x(5), altri r-x(5): il classico per i programmi"},{t:"cmd",x:"chmod 644 file.txt",d:"proprietario legge+scrive(6), gli altri solo leggono(4): il classico per i file normali"},{t:"prova",x:"Crea uno script vuoto <code>test.sh</code>, guarda i permessi con <code>ls -l</code>, poi rendilo eseguibile.",target:"Dopo chmod, ls -l deve mostrare delle x nei permessi."}]},{id:"lx-sudo",nome:"sudo e root",fascia:"utile",corpo:[{t:"p",x:"<b>root</b> \xE8 il super-utente: pu\xF2 fare tutto, nessun permesso lo ferma. Per sicurezza non lavori come root tutto il tempo. <code>sudo</code> (super user do) esegue UN comando con i poteri di root."},{t:"cmd",x:"sudo rm file-di-sistema",d:"esegue il comando come root (ti chieder\xE0 la password)"},{t:"nota",x:"In Termux (rootless) <code>sudo</code> di solito non c'\xE8 e non serve: sei gi\xE0 \xABpadrone\xBB del tuo ambiente isolato, ma senza i poteri su tutto Android. Su un Pi con Kali invece lo userai spesso."}]}]},{id:"lx-testo",nome:"Cercare e filtrare il testo",lezioni:[{id:"lx-grep",nome:"grep: trovare righe",fascia:"essenziale",corpo:[{t:"p",x:"<code>grep</code> cerca una parola dentro uno o pi\xF9 file e ti mostra solo le righe che la contengono. \xC8 uno degli strumenti pi\xF9 usati in assoluto."},{t:"cmd",x:"grep errore log.txt",d:"mostra tutte le righe di log.txt che contengono \xABerrore\xBB"},{t:"cmd",x:"grep -i ciao file.txt",d:"-i ignora maiuscole/minuscole (trova Ciao, CIAO, ciao)"},{t:"cmd",x:"grep -r password .",d:"-r cerca ricorsivamente in tutti i file sotto la cartella corrente"},{t:"cmd",x:"grep -n errore log.txt",d:"-n mostra anche il numero di riga"},{t:"nota",x:"grep diventa potentissimo combinato con la pipe (lo vedrai tra poco): prende l'output di un comando e ne tiene solo le righe che ti interessano."}]},{id:"lx-find",nome:"find: trovare file",fascia:"utile",corpo:[{t:"p",x:"<code>grep</code> cerca DENTRO i file; <code>find</code> cerca I file (per nome, tipo, data...)."},{t:"cmd",x:'find . -name "*.txt"',d:"trova tutti i file .txt a partire dalla cartella corrente"},{t:"cmd",x:"find . -type d",d:"trova solo le cartelle (-type f per i soli file)"},{t:"cmd",x:"find . -size +1M",d:"trova i file pi\xF9 grandi di 1 megabyte"}]},{id:"lx-altri-testo",nome:"wc, sort, uniq, cut",fascia:"utile",corpo:[{t:"cmd",x:"wc -l file.txt",d:"conta le righe del file (word count, -l = lines)"},{t:"cmd",x:"sort file.txt",d:"ordina le righe alfabeticamente"},{t:"cmd",x:"uniq file.txt",d:"rimuove le righe duplicate consecutive (spesso dopo sort)"},{t:"cmd",x:"cut -d: -f1 file.txt",d:"taglia colonne: -d: separa a \xAB:\xBB, -f1 tiene la prima"}]}]},{id:"lx-pipe",nome:"Pipe e redirezioni",lezioni:[{id:"lx-pipe-cosa",nome:"La pipe |: incatenare comandi",fascia:"essenziale",corpo:[{t:"p",x:"Questa \xE8 l'idea pi\xF9 importante di tutto Linux. La <b>pipe</b> (il simbolo <code>|</code>) prende l'output di un comando e lo passa come input al comando successivo. Cos\xEC incateni strumenti semplici per fare cose complesse."},{t:"cmd",x:"ls | grep .txt",d:"ls elenca i file, | passa l'elenco a grep, grep tiene solo quelli con .txt"},{t:"cmd",x:"cat log.txt | grep errore | wc -l",d:"leggi il log \u2192 tieni le righe con \xABerrore\xBB \u2192 contale: quanti errori ci sono"},{t:"cmd",x:"ls -l | sort -k5 -n",d:"elenca i file e ordinali per dimensione (5\xAA colonna, numerica)"},{t:"p",x:"\xC8 la filosofia Unix: ogni comando fa UNA cosa bene, e tu li combini. Invece di un mega-programma, tanti piccoli attrezzi collegati con <code>|</code>."},{t:"prova",x:"Elenca i file della tua home e tieni solo quelli che contengono una certa lettera nel nome, usando ls e grep con la pipe.",target:"Devi vedere solo i nomi che contengono quella lettera."}]},{id:"lx-redir",nome:"Redirezioni: > >> <",fascia:"essenziale",corpo:[{t:"p",x:"Normalmente l'output di un comando va a schermo. Con le redirezioni lo mandi in un file (o prendi l'input da un file)."},{t:"tab",rows:[["ls > lista.txt","scrivi l'output in lista.txt (SOVRASCRIVE il file se esiste)"],["ls >> lista.txt","AGGIUNGI l'output in fondo al file (non cancella)"],["comando < input.txt","dai in pasto il file come input al comando"],["comando 2> errori.txt","manda i messaggi di errore in un file separato"]]},{t:"nota",x:"Differenza chiave: <code>&gt;</code> azzera e riscrive, <code>&gt;&gt;</code> accoda. Confonderli pu\xF2 farti perdere il contenuto di un file."}]}]},{id:"lx-proc",nome:"Processi e sistema",lezioni:[{id:"lx-proc-cosa",nome:"Vedere e fermare i processi",fascia:"utile",corpo:[{t:"p",x:"Un <b>processo</b> \xE8 un programma in esecuzione. Ognuno ha un numero identificativo, il <b>PID</b> (process ID)."},{t:"cmd",x:"ps",d:"mostra i processi della tua sessione"},{t:"cmd",x:"ps aux",d:"mostra TUTTI i processi del sistema con dettagli"},{t:"cmd",x:"top",d:"monitor in tempo reale: cosa consuma CPU e memoria (q per uscire)"},{t:"cmd",x:"kill 1234",d:"termina il processo con PID 1234 (chiede gentilmente)"},{t:"cmd",x:"kill -9 1234",d:"lo termina a forza, se non risponde"}]},{id:"lx-bg",nome:"Primo piano e sfondo",fascia:"buono",corpo:[{t:"p",x:"Un comando lento blocca il terminale finch\xE9 non finisce. Puoi mandarlo \xABin sfondo\xBB per continuare a lavorare."},{t:"tab",rows:[["comando &","lancia il comando in sfondo (il terminale resta libero)"],["Ctrl+C","interrompe il comando in corso"],["Ctrl+Z","mette in pausa il comando corrente"],["jobs","elenca i comandi in sfondo/pausa"],["fg","riporta in primo piano l'ultimo job"]]}]},{id:"lx-sys",nome:"Info su sistema e spazio",fascia:"buono",corpo:[{t:"cmd",x:"df -h",d:"quanto spazio libero sui dischi (-h leggibile)"},{t:"cmd",x:"du -sh cartella/",d:"quanto occupa una cartella"},{t:"cmd",x:"free -h",d:"quanta memoria RAM \xE8 libera/usata"},{t:"cmd",x:"uname -a",d:"informazioni sul sistema (kernel, architettura)"},{t:"cmd",x:"whoami",d:"con che utente sei loggato"},{t:"cmd",x:"history",d:"la lista dei comandi che hai dato (freccia su per riusarli)"}]}]},{id:"lx-pkg",nome:"Installare programmi",lezioni:[{id:"lx-pkg-cosa",nome:"I gestori di pacchetti",fascia:"utile",corpo:[{t:"p",x:"Su Linux non scarichi \xAB.exe\xBB dai siti: usi un <b>gestore di pacchetti</b>, un comando che scarica e installa programmi da archivi ufficiali, risolvendo da s\xE9 le dipendenze (gli altri programmi di cui ha bisogno)."},{t:"p",x:"Il nome cambia a seconda del sistema:"},{t:"tab",rows:[["pkg install nome","Termux (quello che usi sul tablet)"],["apt install nome","Debian, Ubuntu, Kali (sul Pi userai questo)"],["sudo apt update","aggiorna la lista dei pacchetti disponibili (fallo prima di installare)"]]},{t:"nota",x:"<code>pkg</code> di Termux \xE8 in pratica una versione di <code>apt</code>. I comandi si somigliano: <code>update</code>, <code>upgrade</code>, <code>install</code>, <code>uninstall</code>, <code>search</code>."}]}]}]};var Ci={id:"bash",nome:"Bash",icona:"#!",desc:"Dopo i comandi singoli, impari a metterli in uno script: variabili, condizioni, cicli. Automatizzi quello che faresti a mano.",moduli:[{id:"bash-base",nome:"Il primo script",lezioni:[{id:"bash-cosa",nome:"Cos'\xE8 uno script",fascia:"essenziale",corpo:[{t:"p",x:"Uno script bash \xE8 un file di testo con dentro una lista di comandi, che vengono eseguiti uno dopo l'altro. Invece di scrivere dieci comandi a mano ogni volta, li scrivi una volta in un file e lanci quello."},{t:"h",x:"Lo scheletro minimo"},{t:"out",x:`#!/bin/bash
echo "Ciao mondo"`},{t:"p",x:"La prima riga, <code>#!/bin/bash</code>, si chiama <b>shebang</b>: dice al sistema \xABesegui questo file con bash\xBB. <code>echo</code> stampa un testo a schermo. Le righe che iniziano con <code>#</code> (tranne lo shebang) sono <b>commenti</b>, ignorati."},{t:"h",x:"Crearlo e lanciarlo"},{t:"cmd",x:"nano ciao.sh",d:"apri l'editor, scrivi lo script, salva con Ctrl+O e esci con Ctrl+X"},{t:"cmd",x:"chmod +x ciao.sh",d:"rendilo eseguibile (ricordi i permessi? serve la x)"},{t:"cmd",x:"./ciao.sh",d:"lancialo. Il ./ dice \xAB\xE8 qui, nella cartella corrente\xBB"},{t:"prova",x:"Crea uno script che stampa il tuo nome, rendilo eseguibile e lancialo.",target:"A schermo deve comparire il tuo nome."}]}]},{id:"bash-var",nome:"Variabili",lezioni:[{id:"bash-var-cosa",nome:"Salvare valori",fascia:"essenziale",corpo:[{t:"p",x:"Una variabile \xE8 un contenitore con un nome, dove metti un valore per riusarlo."},{t:"out",x:`nome="Andrea"
echo "Ciao $nome"`},{t:"p",x:`Regole importanti di bash: <b>niente spazi</b> attorno all'<code>=</code> quando assegni (<code>nome="x"</code>, non <code>nome = "x"</code>). Per <b>usare</b> il valore metti il <code>$</code> davanti: <code>$nome</code>.`},{t:"h",x:"Catturare l'output di un comando"},{t:"out",x:`oggi=$(date)
echo "Adesso \xE8 $oggi"`},{t:"p",x:"<code>$(comando)</code> esegue il comando e ne mette l'output nella variabile. \xC8 potentissimo: combini comandi e valori."},{t:"nota",x:`Virgolette doppie <code>"..."</code>: dentro, le variabili vengono sostituite. Virgolette singole <code>'...'</code>: tutto letterale, niente sostituzione.`}]}]},{id:"bash-logica",nome:"Decisioni e cicli",lezioni:[{id:"bash-if",nome:"if: fare scelte",fascia:"essenziale",corpo:[{t:"p",x:"L'<code>if</code> esegue qualcosa solo se una condizione \xE8 vera."},{t:"out",x:`if [ -f note.txt ]; then
  echo "Il file esiste"
else
  echo "Non c'\xE8"
fi`},{t:"p",x:"La condizione sta tra <code>[ ]</code> (con spazi dentro, obbligatori). <code>then</code> apre il blocco, <code>fi</code> (if al contrario) lo chiude. <code>else</code> \xE8 il \xABaltrimenti\xBB."},{t:"h",x:"Test pi\xF9 comuni"},{t:"tab",rows:[["[ -f file ]","vero se il file esiste"],["[ -d cartella ]","vero se la cartella esiste"],['[ -z "$x" ]',"vero se la variabile \xE8 vuota"],['[ "$a" = "$b" ]',"vero se due testi sono uguali"],['[ "$n" -gt 5 ]',"vero se il numero \xE8 maggiore di 5 (-lt minore, -eq uguale)"]]}]},{id:"bash-for",nome:"for: ripetere",fascia:"essenziale",corpo:[{t:"p",x:"Il <code>for</code> ripete un blocco per ogni elemento di una lista."},{t:"out",x:`for file in *.txt; do
  echo "Trovato: $file"
done`},{t:"p",x:"Qui <code>*.txt</code> \xE8 la lista di tutti i file .txt; ad ogni giro <code>file</code> vale uno di essi. <code>do</code> apre, <code>done</code> chiude."},{t:"out",x:`for i in 1 2 3; do
  echo "Numero $i"
done`},{t:"prova",x:"Scrivi uno script che per ogni file .txt nella cartella ne stampa il nome.",target:"Deve elencare i nomi dei tuoi file .txt, uno per riga."}]},{id:"bash-args",nome:"Argomenti e concatenazione",fascia:"utile",corpo:[{t:"p",x:"Uno script pu\xF2 ricevere argomenti quando lo lanci: <code>./script.sh ciao 42</code>. Dentro li leggi con <code>$1</code> (primo), <code>$2</code> (secondo), e cos\xEC via. <code>$0</code> \xE8 il nome dello script, <code>$@</code> sono tutti."},{t:"out",x:`#!/bin/bash
echo "Hai passato: $1 e $2"`},{t:"h",x:"Concatenare comandi al volo"},{t:"tab",rows:[["cmd1 && cmd2","esegui cmd2 SOLO se cmd1 \xE8 andato a buon fine"],["cmd1 || cmd2","esegui cmd2 solo se cmd1 \xE8 FALLITO"],["cmd1 ; cmd2","esegui entrambi in sequenza, qualunque cosa succeda"]]},{t:"nota",x:"<code>&&</code> \xE8 utilissimo: <code>mkdir prova && cd prova</code> entra nella cartella solo se \xE8 stata creata davvero."}]}]}]};var Ii={id:"net",nome:"Reti",icona:"<=>",desc:"La teoria che rende utili gli strumenti: IP, porte, TCP/UDP, DNS, HTTP, cifratura. Senza questa, nmap ti d\xE0 numeri che non sai leggere.",moduli:[{id:"net-fond",nome:"1 \xB7 Fondamenti",lezioni:[{id:"net-rete",nome:"Rete, pacchetti, client e server",fascia:"essenziale",corpo:[{t:"p",x:"Una <b>rete</b> \xE8 un insieme di dispositivi che si scambiano dati. Quei dati non viaggiano tutti in blocco: vengono spezzati in <b>pacchetti</b>, pezzetti numerati che viaggiano separati e vengono riassemblati all'arrivo. Se uno si perde, si rimanda solo quello."},{t:"p",x:"Quasi tutto in rete \xE8 una conversazione tra due ruoli: il <b>client</b> chiede, il <b>server</b> risponde. Il tuo browser (client) chiede una pagina; il computer di un sito (server) gliela manda. Lo stesso dispositivo pu\xF2 fare entrambi i ruoli in momenti diversi."}]},{id:"net-strati",nome:"La rete a strati",fascia:"utile",corpo:[{t:"p",x:"La rete \xE8 organizzata a <b>livelli</b> sovrapposti: ogni strato si occupa di una cosa e si appoggia a quello sotto, senza sapere come lavora. \xC8 come spedire una lettera: tu scrivi il contenuto, non ti importa come il camion la trasporta."},{t:"p",x:"Il modello classico (TCP/IP) ha quattro strati, dal pi\xF9 concreto al pi\xF9 astratto:"},{t:"tab",rows:[["Applicazione","i programmi: web (HTTP), email, DNS. Quello che usi tu"],["Trasporto","TCP e UDP: come i dati viaggiano affidabili o veloci"],["Rete","IP: l'indirizzamento, trovare la strada tra reti diverse"],["Accesso","il mezzo fisico: cavo, Wi-Fi, i segnali veri"]]},{t:"nota",x:"Esiste anche il modello ISO/OSI a 7 livelli, pi\xF9 dettagliato ma pi\xF9 teorico. Per te bastano questi quattro: ogni strumento che userai vive in uno di questi strati."}]}]},{id:"net-ind",nome:"2 \xB7 Indirizzi",lezioni:[{id:"net-ip",nome:"L'indirizzo IP",fascia:"essenziale",corpo:[{t:"p",x:"L'<b>indirizzo IP</b> \xE8 l'identit\xE0 di un dispositivo in rete: come un indirizzo di casa, dice dove mandare i pacchetti. Due versioni:"},{t:"tab",rows:[["IPv4","4 numeri 0-255, es. 192.168.1.10. Il pi\xF9 comune, ma gli indirizzi stanno finendo"],["IPv6","molto pi\xF9 lungo, es. 2001:0db8:... creato perch\xE9 gli IPv4 non bastano pi\xF9"]]},{t:"h",x:"Pubblico vs privato"},{t:"p",x:"L'IP <b>pubblico</b> \xE8 quello con cui esci su internet, lo stesso per tutta casa tua, assegnato dal provider. Gli IP <b>privati</b> sono quelli interni, uno per dispositivo, validi solo dentro la tua rete. Ecco perch\xE9 il tuo telefono a casa \xE8 tipo <code>192.168.1.x</code>: quello \xE8 un range riservato alle reti private."},{t:"tab",rows:[["192.168.x.x","range privato tipico delle case"],["10.x.x.x","range privato, spesso aziende"],["127.0.0.1","localhost: \xABme stesso\xBB. Parlare col proprio computer"]]}]},{id:"net-mac",nome:"MAC e localhost",fascia:"utile",corpo:[{t:"p",x:"L'<b>indirizzo MAC</b> \xE8 la \xABtarga\xBB fisica della scheda di rete, incisa in fabbrica (es. <code>a4:5e:60:...</code>). Differenza con l'IP: il MAC \xE8 fisso e identifica l'hardware; l'IP cambia a seconda della rete in cui ti colleghi. Il MAC conta solo dentro la rete locale; per viaggiare tra reti si usa l'IP."},{t:"p",x:"<b>localhost</b> (<code>127.0.0.1</code>) \xE8 un indirizzo speciale che punta a te stesso. Quando sviluppi un sito Flask e lo provi in locale, gira su localhost: il browser e il server sono sullo stesso computer."}]}]},{id:"net-sub",nome:"3 \xB7 Divisione della rete",lezioni:[{id:"net-subnet",nome:"Sottoreti, subnet mask, CIDR",fascia:"utile",corpo:[{t:"p",x:"Una rete grande si divide in <b>sottoreti</b> (subnet), gruppi di indirizzi che stanno \xABinsieme\xBB. La <b>subnet mask</b> dice quale parte dell'IP identifica la rete e quale il singolo dispositivo."},{t:"p",x:"La notazione <b>CIDR</b> lo scrive corto: <code>192.168.1.0/24</code>. Quel <code>/24</code> significa \xABi primi 24 bit sono la rete, il resto sono i dispositivi\xBB \u2192 qui gli indirizzi vanno da 192.168.1.1 a 192.168.1.254."},{t:"nota",x:"Vedrai <code>/24</code> quando lancerai nmap: <code>nmap 192.168.1.0/24</code> vuol dire \xABscansiona tutti i dispositivi di questa sottorete\xBB."}]},{id:"net-gw",nome:"Gateway e broadcast",fascia:"utile",corpo:[{t:"p",x:"Il <b>gateway</b> \xE8 la porta d'uscita della tua rete verso le altre: \xE8 il router. Quando un pacchetto deve uscire da casa, passa dal gateway (spesso <code>192.168.1.1</code>)."},{t:"p",x:"Il <b>broadcast</b> \xE8 \xABparlare a tutti\xBB nella rete contemporaneamente: un pacchetto broadcast lo ricevono tutti i dispositivi della sottorete. Serve, per esempio, a un dispositivo nuovo per chiedere \xABchi c'\xE8 qui?\xBB."}]}]},{id:"net-porte",nome:"4 \xB7 Porte e servizi",lezioni:[{id:"net-porte-cosa",nome:"Porte e socket",fascia:"essenziale",corpo:[{t:"p",x:"Un dispositivo ha un solo IP ma fa girare tanti servizi insieme (un sito, la posta, l'accesso remoto...). Come si distinguono? Con le <b>porte</b>: numeri che identificano un servizio specifico su quel dispositivo. L'IP \xE8 il palazzo, la porta \xE8 l'interno."},{t:"h",x:"Le porte da conoscere"},{t:"tab",rows:[["22","SSH \u2014 accesso remoto al terminale"],["80","HTTP \u2014 siti web (non cifrati)"],["443","HTTPS \u2014 siti web cifrati"],["53","DNS \u2014 risoluzione dei nomi"],["21","FTP \u2014 trasferimento file (vecchio)"],["3306","MySQL \u2014 database"]]},{t:"p",x:"IP + porta insieme formano un <b>socket</b> (es. <code>192.168.1.10:443</code>): l'indirizzo esatto di un servizio preciso. Quando nmap ti dice \xABporta 22 aperta\xBB, ti sta dicendo che l\xEC c'\xE8 un SSH in ascolto, e quindi una possibile via d'accesso da controllare."}]}]},{id:"net-trasp",nome:"5 \xB7 TCP e UDP",lezioni:[{id:"net-tcpudp",nome:"I due protocolli di trasporto",fascia:"essenziale",corpo:[{t:"p",x:"Quando i dati viaggiano, lo fanno con uno di due stili opposti:"},{t:"tab",rows:[["TCP","affidabile: ogni pacchetto riceve conferma, se si perde si rimanda. Come una telefonata: \xABmi senti?\xBB \xABs\xEC\xBB. Usato per web, email, file"],["UDP","veloce ma senza conferme: spari i pacchetti e via, alcuni possono perdersi. Come una cartolina. Usato per video in diretta, giochi, DNS"]]},{t:"p",x:"TCP sceglie la sicurezza, UDP la velocit\xE0. Guardi un film in streaming? UDP: meglio un frame perso che un blocco. Scarichi un file? TCP: non puoi permetterti un pezzo mancante."}]},{id:"net-handshake",nome:"Il three-way handshake",fascia:"utile",corpo:[{t:"p",x:"Prima di scambiarsi dati, TCP fa una stretta di mano in tre mosse (<b>three-way handshake</b>):"},{t:"tab",rows:[["1. SYN","il client: \xABvoglio parlare\xBB"],["2. SYN-ACK","il server: \xABok, ti sento, parliamo\xBB"],["3. ACK","il client: \xABperfetto, inizio\xBB"]]},{t:"nota",x:"Ti suona? \xC8 lo stesso concetto dell'handshake del Wi-Fi: uno scambio iniziale che stabilisce la connessione. nmap, per capire se una porta \xE8 aperta, prova proprio a iniziare questo handshake."}]}]},{id:"net-dns",nome:"6 \xB7 DNS",lezioni:[{id:"net-dns-cosa",nome:"La rubrica di internet",fascia:"essenziale",corpo:[{t:"p",x:"Tu scrivi <code>google.com</code>, ma i computer si trovano per IP, non per nome. Il <b>DNS</b> (Domain Name System) \xE8 la rubrica che traduce il nome nel numero: <code>google.com</code> \u2192 <code>142.250.180.x</code>."},{t:"h",x:"Come avviene"},{t:"p",x:"Quando scrivi un indirizzo, il tuo dispositivo chiede a un server DNS \xABqual \xE8 l'IP di questo nome?\xBB, riceve il numero, e solo allora si collega. Succede in millisecondi, prima di ogni visita."},{t:"p",x:"<b>Perch\xE9 \xE8 un punto debole:</b> se qualcuno controlla il DNS che usi, pu\xF2 mentirti sull'IP. Tu scrivi il nome giusto, ma lui ti manda all'indirizzo sbagliato (una pagina-trappola). \xC8 il dirottamento DNS, il cuore dell'attacco \xABevil twin\xBB."}]}]},{id:"net-app",nome:"7 \xB7 Il web (HTTP)",lezioni:[{id:"net-http",nome:"HTTP: richiesta e risposta",fascia:"essenziale",corpo:[{t:"p",x:"<b>HTTP</b> \xE8 il linguaggio del web. Funziona a coppie richiesta\u2192risposta: il browser manda una <b>richiesta</b>, il server torna una <b>risposta</b>. Ogni richiesta ha un <b>metodo</b> che dice cosa vuoi fare:"},{t:"tab",rows:[["GET","\xABdammi\xBB \u2014 chiedere una pagina o dei dati"],["POST","\xABprendi questo\xBB \u2014 inviare dati (un form, un login)"],["PUT","\xABaggiorna\xBB \u2014 modificare una risorsa"],["DELETE","\xABcancella\xBB \u2014 rimuovere una risorsa"]]},{t:"h",x:"I codici di stato"},{t:"p",x:"La risposta porta un numero che dice com'\xE8 andata:"},{t:"tab",rows:[["200","OK, tutto bene"],["301 / 302","spostato, redirezione"],["403","vietato, non hai il permesso"],["404","non trovato"],["500","errore del server"]]},{t:"nota",x:"I codici hanno fasce: 2xx = successo, 3xx = redirezioni, 4xx = colpa tua (richiesta sbagliata), 5xx = colpa del server. Li vedrai usando curl e costruendo siti con Flask."}]},{id:"net-https",nome:"HTTPS, TLS e API",fascia:"essenziale",corpo:[{t:"p",x:"<b>HTTPS</b> \xE8 HTTP + cifratura. La \xABS\xBB \xE8 data da <b>TLS</b>, il protocollo che cifra tutto il traffico tra browser e server. Senza, chi intercetta legge tutto in chiaro (password comprese); con HTTPS vede solo buste sigillate."},{t:"p",x:"TLS fa due cose: <b>cifra</b> i dati in transito, e <b>verifica l'identit\xE0</b> del server con un <b>certificato</b> (una prova crittografica che quel sito \xE8 davvero chi dice). Se il certificato non torna, il browser ti avvisa con la schermata rossa."},{t:"h",x:"Cos'\xE8 un'API"},{t:"p",x:"Un'<b>API</b> \xE8 un modo per far parlare due programmi: invece di una pagina per gli umani, il server espone dei \xABpunti d'accesso\xBB che restituiscono dati grezzi (di solito in formato JSON). Quando costruirai siti con Flask, creerai tu delle API: indirizzi che, interrogati, rispondono con dati invece che con pagine."}]}]},{id:"net-assegna",nome:"8 \xB7 DHCP e NAT",lezioni:[{id:"net-dhcp",nome:"Come ottieni un IP e come esci",fascia:"utile",corpo:[{t:"p",x:"<b>DHCP</b> \xE8 il servizio che ti assegna un IP automaticamente quando ti colleghi a una rete. Non devi configurare niente: entri nel Wi-Fi e il router (via DHCP) ti d\xE0 un indirizzo libero. \xC8 il \xABbenvenuto, ecco il tuo posto\xBB."},{t:"p",x:"<b>NAT</b> risolve il problema che hai un solo IP pubblico ma tanti dispositivi. Il router traduce: tutti i tuoi dispositivi privati (telefono, PC, TV) escono su internet facendo finta di essere quell'unico IP pubblico, e il router tiene il conto di chi ha chiesto cosa per smistare le risposte. Ecco perch\xE9 il mondo esterno vede un solo indirizzo per tutta casa tua."}]}]},{id:"net-sec",nome:"9 \xB7 Wi-Fi e sicurezza",lezioni:[{id:"net-wifi",nome:"WPA, firewall, VPN",fascia:"utile",corpo:[{t:"h",x:"Sicurezza Wi-Fi"},{t:"p",x:"<b>WPA2</b> e <b>WPA3</b> sono i protocolli che cifrano il Wi-Fi. Per entrare serve la password, e lo scambio iniziale (<b>handshake</b>) contiene una prova crittografica di conoscerla. Catturare quell'handshake e attaccarlo offline \xE8 la base del test delle password Wi-Fi \u2014 ma serve la <b>monitor mode</b> e la <b>injection</b>, che un chip interno non espone (ti serve un adattatore apposta). WPA3 chiude proprio questo tipo di attacco."},{t:"h",x:"Firewall"},{t:"p",x:"Un <b>firewall</b> \xE8 un filtro che decide quali pacchetti passano e quali no, in base a regole (porta, indirizzo, direzione). Blocca connessioni indesiderate: per esempio chiude le porte che non devono essere raggiungibili da fuori."},{t:"h",x:"VPN"},{t:"p",x:"Una <b>VPN</b> crea un tunnel cifrato tra te e un server: tutto il tuo traffico passa l\xEC dentro, cifrato, e esce dal server VPN con il suo IP. <b>Cosa protegge:</b> il contenuto e la destinazione del traffico da chi \xE8 sulla tua rete locale (utile su Wi-Fi pubblici). <b>Cosa non fa:</b> non ti rende anonimo verso i siti che richiedono login, e il gestore della VPN vede il tuo traffico (per questo conta fidarsi di chi la offre)."}]}]},{id:"net-ponte",nome:"10 \xB7 Strumenti \u2194 concetti",lezioni:[{id:"net-ponte-tab",nome:"Quale comando tocca quale concetto",fascia:"essenziale",corpo:[{t:"p",x:"La tabella-ponte: ogni strumento che hai installato lavora su un concetto di questa sezione. Quando lo lanci, sai cosa stai guardando."},{t:"tab",rows:[["ifconfig / ip","il tuo IP e MAC, la tua posizione nella rete"],["nmap","host di una sottorete, porte aperte, servizi"],["tcpdump","i pacchetti veri, i protocolli (TCP/UDP) in transito"],["curl","richieste HTTP: metodi, codici di stato, risposte"],["ssh","connessione sulla porta 22, via TCP"],["dig (se lo installi)","le risoluzioni DNS, nome \u2192 IP"]]},{t:"nota",x:"Adesso quando nmap ti dice \xABporta 443/tcp open https\xBB hai tutti i pezzi: 443 = la porta, tcp = il trasporto affidabile, https = il servizio web cifrato."}]}]}]};var qi={id:"tools",nome:"Strumenti",icona:"[]",desc:"Guida pratica a ci\xF2 che hai installato: cosa fa ognuno, i comandi che userai davvero, e cosa funziona offline.",moduli:[{id:"t-py",nome:"python",lezioni:[{id:"t-py-g",nome:"Python da terminale",fascia:"essenziale",corpo:[{t:"p",x:"Python \xE8 il linguaggio del tuo backend (Flask) e lo strumento di automazione pi\xF9 versatile. Da terminale lo usi in due modi."},{t:"h",x:"Modo interattivo (REPL)"},{t:"cmd",x:"python",d:"entra nell'interprete: scrivi codice riga per riga e lo vedi girare subito. Esci con exit()"},{t:"out",x:`>>> 2 + 2
4
>>> print("ciao")
ciao`},{t:"h",x:"Eseguire uno script"},{t:"cmd",x:"python script.py",d:"esegue tutto il file script.py"},{t:"nota",x:"Il REPL \xE8 perfetto per provare una riga al volo; lo script per cose che riusi. Tutto offline, una volta installato Python."},{t:"prova",x:"Entra in Python, fai stampare la somma di due numeri, poi esci.",target:"Devi vedere il risultato della somma e tornare al prompt della shell."}]}]},{id:"t-git",nome:"git",lezioni:[{id:"t-git-g",nome:"Versionare il codice",fascia:"essenziale",corpo:[{t:"p",x:"git tiene la storia delle modifiche dei tuoi progetti: puoi vedere cosa hai cambiato e tornare indietro. Funziona in locale, offline \u2014 internet serve solo per sincronizzare con GitHub."},{t:"h",x:"Il flusso base"},{t:"cmd",x:"git init",d:"trasforma la cartella corrente in un repository git"},{t:"cmd",x:"git status",d:"cosa \xE8 cambiato, cosa \xE8 pronto da salvare"},{t:"cmd",x:"git add .",d:"prepara tutti i file modificati per il salvataggio (. = tutto)"},{t:"cmd",x:'git commit -m "descrizione"',d:"salva uno \xABscatto\xBB dello stato con un messaggio"},{t:"cmd",x:"git log",d:"la storia dei salvataggi fatti"},{t:"nota",x:"Un <b>commit</b> \xE8 una fotografia del progetto in un momento. Il messaggio dice cosa hai cambiato. Fai commit piccoli e frequenti: cos\xEC torni indietro con precisione."}]}]},{id:"t-nmap",nome:"nmap",lezioni:[{id:"t-nmap-g",nome:"Scansionare la rete",fascia:"essenziale",corpo:[{t:"p",x:"nmap esplora una rete a cui sei collegato: quali dispositivi ci sono, quali porte hanno aperte, quali servizi girano. \xC8 lo strumento di ricognizione per eccellenza. Funziona anche se la rete non naviga, perch\xE9 lavora DENTRO la rete."},{t:"h",x:"I comandi che userai"},{t:"cmd",x:"nmap 192.168.1.1",d:"scansiona un singolo dispositivo: che porte ha aperte"},{t:"cmd",x:"nmap 192.168.1.0/24",d:"scansiona tutta la sottorete: trova tutti i dispositivi (ricordi il /24?)"},{t:"cmd",x:"nmap -sn 192.168.1.0/24",d:"-sn: solo scoperta host, chi \xE8 vivo senza scansionare le porte (veloce)"},{t:"cmd",x:"nmap -p 22,80,443 IP",d:"-p: controlla solo porte specifiche"},{t:"cmd",x:"nmap -sV IP",d:"-sV: prova a capire quale programma e versione gira su ogni porta"},{t:"nota",x:"Prima trova il tuo IP e la tua sottorete con <code>ifconfig</code>: ti dice il range da scansionare. \u26A0\uFE0F Scansiona solo reti TUE o su cui hai permesso: altrove \xE8 illegale."},{t:"prova",x:"Trova il tuo IP, ricava la sottorete, e lancia una scoperta host (-sn) per vedere chi \xE8 connesso alla tua rete.",target:"nmap deve elencare uno o pi\xF9 dispositivi \xABhost up\xBB con il loro IP."}]}]},{id:"t-john",nome:"john",lezioni:[{id:"t-john-g",nome:"Capire il cracking",fascia:"utile",corpo:[{t:"p",x:"John the Ripper serve a <b>capire</b> come funziona il cracking delle password: prova candidate contro un hash finch\xE9 una combacia. Usa la CPU (non la GPU come hashcat), quindi gira su Termux. Qui \xE8 uno strumento didattico, non per attaccare sul serio \u2014 il cracking vero lo farai su un PC con GPU."},{t:"h",x:"Il concetto in pratica"},{t:"p",x:"John prende un file di hash e ci lancia contro un dizionario o la forza bruta. Se la password \xE8 debole, la trova; se \xE8 lunga e casuale, arranca all'infinito. \xC8 il modo pi\xF9 concreto per vedere perch\xE9 \xABlunga e senza senso\xBB batte \xABcorta e complicata\xBB."},{t:"cmd",x:"john --list=formats",d:"elenca i tipi di hash che sa attaccare (per verificare l'installazione)"},{t:"cmd",x:"john --wordlist=lista.txt hash.txt",d:"attacca gli hash in hash.txt provando le parole di lista.txt"},{t:"nota",x:"Per sperimentare ti serve un file di hash e una wordlist. Pi\xF9 avanti ti preparo un mini-esercizio sicuro (hash di parole tue, non di nessun altro). Ricorda: l'inversione \xE8 impossibile, il cracking \xE8 solo indovinare-e-confrontare."}]}]},{id:"t-curl",nome:"curl",lezioni:[{id:"t-curl-g",nome:"Parlare con i server",fascia:"utile",corpo:[{t:"p",x:"curl fa richieste HTTP da terminale: interroga un server e ti mostra la risposta grezza. \xC8 sia uno strumento di rete (vedi come risponde un dispositivo) sia uno strumento da web dev (provi le tue API). Su una rete locale, i dispositivi (router, telecamere) hanno spesso una pagina web: con curl la interroghi senza browser."},{t:"cmd",x:"curl http://192.168.1.1",d:"scarica la pagina di quel dispositivo e la stampa"},{t:"cmd",x:"curl -I sito",d:"-I: solo le intestazioni (header) e il codice di stato, non il contenuto"},{t:"cmd",x:"curl -v sito",d:"-v (verbose): mostra tutta la conversazione, richiesta e risposta"},{t:"cmd",x:'curl -X POST -d "dato=1" sito',d:"-X sceglie il metodo, -d invia dati: cos\xEC provi un POST"},{t:"nota",x:"curl ha bisogno di qualcosa con cui parlare: un server sulla rete, o internet. Su una rete locale senza internet interroghi i dispositivi interni; per i siti serve la connessione."}]}]},{id:"t-nettools",nome:"net-tools / iproute2",lezioni:[{id:"t-nettools-g",nome:"Capire dove sei",fascia:"essenziale",corpo:[{t:"p",x:"Questi danno i comandi base per capire la tua posizione nella rete: che IP hai, qual \xE8 il router, com'\xE8 fatta la rete. \xC8 il punto di partenza prima di lanciare nmap \u2014 ti dice il \xABquartiere\xBB da scansionare."},{t:"cmd",x:"ifconfig",d:"mostra le tue interfacce di rete con IP e MAC (net-tools)"},{t:"cmd",x:"ip addr",d:"stessa cosa, versione moderna (iproute2)"},{t:"cmd",x:"ip route",d:"mostra il gateway: qual \xE8 la porta d'uscita della rete"},{t:"cmd",x:"ping 192.168.1.1",d:"verifica se un dispositivo risponde ed \xE8 raggiungibile"},{t:"nota",x:"Da <code>ifconfig</code> leggi il tuo IP (es. 192.168.1.37): i primi tre numeri + .0/24 sono la tua sottorete da dare a nmap. <code>ping</code> \xE8 il \xABci sei?\xBB pi\xF9 semplice: manda un pacchetto e aspetta la risposta."},{t:"prova",x:"Lancia ifconfig e individua il tuo indirizzo IP nella rete.",target:"Devi saper dire qual \xE8 il tuo IP privato (tipo 192.168.x.x o 10.x.x.x)."}]}]},{id:"t-tcpdum
